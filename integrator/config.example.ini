# StarCitizen_Telemetry configuration
# Copy this to config.ini next to Integrator.exe, or just use the Settings window.

# How often to pull data from the game, in seconds (decimals allowed).
interval = 1

# HTTP endpoint the decoded JSON is POSTed to.
url = https://example.com/api/v1/telemetry

# Authorization for the upload endpoint: none | bearer.
auth = bearer

# Bearer token sent as 'Authorization: Bearer <token>' (used when auth = bearer).
token =

# Verify the endpoint's TLS certificate (true/false).
url_ssl_verify = true

# The game's local gRPC server (ip:port). Normally the default.
source = 127.0.0.1:50051

# Optional: full path to StarCitizen.exe. Leave empty to auto-detect.
exe =

# Send decoded frames to the upload endpoint above (true/false).
send_data = true

# Expose the latest frame over a tiny no-auth local HTTP server (true/false).
# GET any path for the whole frame; add ?path=a.b.c for a single value.
local_server = false

# Address/port the local server binds to. Use 0.0.0.0 to listen on all
# interfaces (may require 'netsh http add urlacl' or admin on Windows).
local_bind = 127.0.0.1
local_port = 8080

# Write the latest frame (the uploaded JSON) to a file on disk, overwriting it
# each cycle (true/false). Leave file_path empty to disable.
file_save = false
file_path =
