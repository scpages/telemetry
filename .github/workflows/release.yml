name: release

# Build the Integrator (exe) and the Touch Portal plugin (.tpp) as self-contained
# Windows artifacts and publish them to a GitHub Release. Trigger by pushing a
# version tag (e.g. `git tag v0.4.0` then `git push origin v0.4.0`), or run it by
# hand from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.4.0)'
        required: true

permissions:
  contents: write   # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # One file that bundles the .NET runtime, so users just download and run it.
      - name: Publish self-contained single-file exe
        shell: pwsh
        run: >
          dotnet publish integrator/Integrator.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish
      - name: Rename asset and generate checksum
        shell: pwsh
        run: |
          Copy-Item publish/Integrator.exe SCTelemetry-Integrator.exe
          (Get-FileHash SCTelemetry-Integrator.exe -Algorithm SHA256).Hash | Out-File -NoNewline SCTelemetry-Integrator.exe.sha256

      # Touch Portal plugin: build the exe, then zip entry.tp + exe into a .tpp
      # (a zip whose single top-level folder is the plugin folder TP expects).
      - name: Publish plugin exe
        shell: pwsh
        run: >
          dotnet publish TouchPortal/JsonHttpFetcher.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o tp-publish
      - name: Package .tpp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg/JsonHttpFetcher | Out-Null
          Copy-Item TouchPortal/entry.tp pkg/JsonHttpFetcher/
          Copy-Item tp-publish/JsonHttpFetcher.exe pkg/JsonHttpFetcher/
          Compress-Archive -Path pkg/JsonHttpFetcher -DestinationPath JsonHttpFetcher.zip -Force
          Copy-Item JsonHttpFetcher.zip JsonHttpFetcher.tpp -Force

      # Create the release and attach both assets. If a release for this tag already
      # exists (e.g. it was drafted in the UI first), just upload the assets to it.
      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          $notes = "Self-contained Windows builds — no .NET install needed.`n`n- **SCTelemetry-Integrator.exe** — the Integrator; download and run.`n- **SCTelemetry-Integrator.exe.sha256** — SHA256 checksum.`n- **JsonHttpFetcher.tpp** — Touch Portal plugin; import via Settings > Import plug-in."
          gh release create "$env:TAG" SCTelemetry-Integrator.exe SCTelemetry-Integrator.exe.sha256 JsonHttpFetcher.tpp --target "$env:SHA" --title "SCTelemetry $env:TAG" --notes "$notes"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release already exists — uploading assets instead."
            gh release upload "$env:TAG" SCTelemetry-Integrator.exe SCTelemetry-Integrator.exe.sha256 JsonHttpFetcher.tpp --clobber
          }
